{% extends "base.html" %}
{% block title %}Xác nhận xóa{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 bg-white p-4 rounded shadow-sm">
    <h3 class="text-danger">Xác nhận xóa</h3>
    <p>Bạn có chắc muốn xóa <b>{{ object }}</b>? Thao tác này không hoàn tác được.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Xóa</button>
      <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
    </form>
  </div>
</div>
{% endblock %}
