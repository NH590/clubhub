<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClubHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">ClubHub</a>
         {% if user.is_authenticated %}
         <a class="nav-link text-white ms-3" href="{% url 'members:list' %}">Thành viên</a>
       {% endif %}
    <div class="ms-auto">
      {% if user.is_authenticated %}
        <span class="text-white me-3">{{ user }} ({{ user.get_role_display }})</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}<button class="btn btn-light btn-sm">Đăng xuất</button>
        </form>
      {% else %}
        <a class="btn btn-light btn-sm" href="{% url 'login' %}">Đăng nhập</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
